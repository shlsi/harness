<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>harness 控制台</title>
<style>
/* ============ 0. 设计变量 / 主题 ============ */
:root{
  --bg:#f5f6f8; --bg-elev:#fff; --card:#fff; --line:#e4e7ec; --line-strong:#cfd4dd;
  --ink:#1e2329; --muted:#6b7280; --faint:#9aa1ab;
  --accent:#2563eb; --accent-ink:#fff; --accent-soft:#eaf1fe;
  --ok:#15803d; --warn:#b45309; --danger:#b91c1c; --danger-soft:#fee2e2;
  --radius:10px; --radius-sm:6px; --radius-lg:14px;
  --shadow-1:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  --shadow-2:0 10px 30px rgba(16,24,40,.14);
  --sp1:4px; --sp2:8px; --sp3:12px; --sp4:16px; --sp5:24px;
  --font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Consolas,"Courier New",monospace;
  --dur:120ms;
}
[data-theme="dark"]{
  --bg:#0e1116; --bg-elev:#161b22; --card:#161b22; --line:#262c36; --line-strong:#3a424f;
  --ink:#e6e9ee; --muted:#9aa3b2; --faint:#6b7480;
  --accent:#5b8def; --accent-soft:#1b2740; --danger-soft:#3b1d1d;
  --shadow-1:0 1px 2px rgba(0,0,0,.5); --shadow-2:0 10px 30px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:var(--font);
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:var(--radius-sm)}

/* ============ 1. 骨架 ============ */
#app{display:grid;grid-template-columns:264px minmax(0,1fr) 0;height:100vh;overflow:hidden}
#app.drawer-open{grid-template-columns:264px minmax(0,1fr) 352px}
aside,main{min-width:0;min-height:0}

/* ---------- 侧栏：会话列表 ---------- */
#sidebar{background:var(--bg-elev);border-right:1px solid var(--line);display:flex;flex-direction:column}
.side-head{padding:var(--sp3);display:flex;gap:var(--sp2);align-items:center;border-bottom:1px solid var(--line)}
.brand{font-weight:700;font-size:15px;letter-spacing:.2px;flex:1;display:flex;align-items:center;gap:6px}
.brand .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.side-search{padding:var(--sp2) var(--sp3)}
#sessionList{list-style:none;margin:0;padding:0 var(--sp2) var(--sp3);overflow:auto;flex:1}
.session-item{padding:8px 10px;border-radius:var(--radius-sm);cursor:pointer;display:flex;flex-direction:column;gap:2px;
  border:1px solid transparent}
.session-item:hover{background:var(--accent-soft)}
.session-item.active{background:var(--accent-soft);border-color:var(--accent)}
.session-item .t{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  display:flex;align-items:center;gap:6px}
.session-item .m{font-size:11.5px;color:var(--muted);display:flex;gap:8px;align-items:center}
.session-item .acts{display:flex;gap:2px;margin-left:auto;opacity:0;transition:opacity .12s}
.session-item:hover .acts,.session-item.active .acts{opacity:1}
.session-item .acts .btn{padding:1px 6px;font-size:11.5px;line-height:1.3}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(21,128,61,.5);
  animation:pulse 1.6s infinite}
@keyframes pulse{to{box-shadow:0 0 0 8px rgba(21,128,61,0)}}
.pending-msg .typing{display:inline-flex;gap:4px;align-items:center}
.pending-msg .typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:typing 1.1s infinite ease-in-out}
.pending-msg .typing i:nth-child(2){animation-delay:.15s}
.pending-msg .typing i:nth-child(3){animation-delay:.3s}
.pending-msg .pending-note{margin-left:8px;color:var(--muted);font-size:12.5px}
@keyframes typing{0%,70%,100%{opacity:.22;transform:translateY(0)}35%{opacity:1;transform:translateY(-2px)}}
.side-foot{padding:var(--sp2) var(--sp3);border-top:1px solid var(--line);display:flex;gap:var(--sp2);align-items:center;
  font-size:12px;color:var(--muted);flex-wrap:wrap}

/* ---------- 主区：对话 ---------- */
#chat{display:flex;flex-direction:column;background:var(--bg)}
#chatHead{display:flex;align-items:center;gap:var(--sp2);padding:var(--sp2) var(--sp3);
  background:var(--bg-elev);border-bottom:1px solid var(--line);min-height:52px}
#chatTitle{font-size:15px;font-weight:650;margin:0;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:text}
#runStatus{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:var(--sp2) var(--sp3);
  border-bottom:1px solid var(--line);background:var(--bg-elev)}
.toolbar .lbl{font-size:12px;color:var(--muted);margin-right:2px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;border:1px solid var(--line-strong);
  border-radius:999px;padding:2px 9px;cursor:pointer;user-select:none;background:var(--card)}
.chip input{margin:0;accent-color:var(--accent)}
.chip.on{border-color:var(--accent);background:var(--accent-soft)}
/* ---- 会话工作区 + 三档权限（#policy）---- */
#policy .ws{max-width:min(46ch,52vw);overflow:hidden}
#policy .ws-path{font-family:var(--mono);font-size:12px;display:block;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
#policy .ws-path.unset{color:var(--faint);font-style:italic}
#policy select{font-size:12px;padding:3px 6px;border:1px solid var(--line-strong);
  border-radius:var(--radius-sm);background:var(--card);color:var(--fg);cursor:pointer}
#policy .hint{font-size:11px;color:var(--faint);margin-left:auto}
.dialog.picker{max-width:640px;display:flex;flex-direction:column;gap:var(--sp2)}
.dialog.picker .head{display:flex;gap:6px;align-items:center}
.dialog.picker .head input{flex:1;min-width:0;font-family:var(--mono);font-size:12px;padding:6px 8px;
  border:1px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--card);color:var(--fg)}
.dialog.picker .list{max-height:52vh;overflow:auto;border:1px solid var(--line);
  border-radius:var(--radius);background:var(--bg-elev);padding:4px}
.dialog.picker .item{padding:5px 8px;border-radius:var(--radius-sm);cursor:pointer;font-size:13px;
  font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dialog.picker .item:hover{background:var(--accent-soft)}
.dialog.picker .item.file{color:var(--faint);cursor:default}
.dialog.picker .item.file:hover{background:transparent}
#log{flex:1;overflow:auto;padding:var(--sp4);display:flex;flex-direction:column;gap:var(--sp3)}
#composer{border-top:1px solid var(--line);background:var(--bg-elev);padding:var(--sp3);display:flex;gap:var(--sp2);
  align-items:flex-end;flex-wrap:wrap}
#attach{display:flex;gap:6px;width:100%;flex-wrap:wrap}
#attach img{height:44px;border-radius:var(--radius-sm);border:1px solid var(--line)}
.attach-chip{position:relative;display:inline-block}
.attach-chip button{position:absolute;top:-6px;right:-6px;width:18px;height:18px;line-height:1;border-radius:50%;
  border:1px solid var(--line);background:var(--card);cursor:pointer;padding:0}
#input{flex:1;min-height:44px;max-height:180px;resize:none;padding:10px 12px;border:1px solid var(--line-strong);
  border-radius:var(--radius);background:var(--card);overflow:auto}
textarea:focus,input:focus{outline:none;border-color:var(--accent)}

/* ---------- 抽屉：面板 ---------- */
#drawer{background:var(--bg-elev);border-left:1px solid var(--line);display:none;flex-direction:column;min-width:0}
#app.drawer-open #drawer{display:flex}
.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto;position:relative}
.tabs button{flex:0 0 auto;border:0;background:none;padding:10px 9px;cursor:pointer;font-size:12.5px;color:var(--muted);
  border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tabs #drawerClose{flex:0 0 auto;padding:10px 12px;font-size:16px;line-height:1;color:var(--muted);
  position:sticky;right:0;background:var(--bg-elev)}
.tabs #drawerClose:hover{color:var(--danger)}
.tbl-wrap{overflow-x:auto}
.mcp-card{border:1px solid var(--line);border-radius:var(--radius);padding:var(--sp3);display:flex;flex-direction:column;gap:var(--sp2);background:var(--card)}
.mcp-card .head{display:flex;gap:var(--sp2);align-items:center}
.mcp-card .head input{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp2)}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
.btn.xs{padding:3px 8px;font-size:12px}
.editor-toolbar{display:flex;gap:6px;align-items:center;margin-top:var(--sp2)}
.issues{margin:0;padding-left:18px;font-size:12px}
.issues li.err{color:var(--danger)} .issues li.warn{color:var(--warn)}
.panes{flex:1;overflow:auto;padding:var(--sp3)}
.pane{display:none;flex-direction:column;gap:var(--sp3)}
.pane.on{display:flex}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:var(--sp3);
  box-shadow:var(--shadow-1)}
.card h3{margin:0 0 var(--sp2);font-size:13px;font-weight:650;color:var(--muted);text-transform:none}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.bar{height:7px;border-radius:999px;background:var(--line);overflow:hidden;margin:6px 0}
.bar>i{display:block;height:100%;background:var(--accent)}
.bar.warn>i{background:var(--warn)} .bar.danger>i{background:var(--danger)}
.seg{display:flex;height:9px;border-radius:999px;overflow:hidden;background:var(--line);margin:6px 0}
.seg i{display:block;height:100%}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend b{width:9px;height:9px;border-radius:2px;display:inline-block}
details.cfg{border:1px solid var(--line);border-radius:var(--radius);margin-bottom:var(--sp2);background:var(--card)}
details.cfg>summary{cursor:pointer;padding:8px 10px;font-weight:600;font-size:13px;display:flex;gap:8px;align-items:center}
details.cfg .body{padding:0 10px 10px;display:flex;flex-direction:column;gap:var(--sp2)}
.field{display:flex;flex-direction:column;gap:3px}
.field label{font-size:12px;color:var(--muted);font-family:var(--mono)}
.field input[type=text],.field input[type=password],.field input[type=number],.field textarea{
  padding:6px 8px;border:1px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--bg-elev);width:100%}
.field textarea{font-family:var(--mono);font-size:12px;min-height:56px;resize:vertical}
.field .hint{font-size:11px;color:var(--faint)}
.field.invalid input,.field.invalid textarea{border-color:var(--danger)}
.field.invalid .hint{color:var(--danger)}
.switch{display:flex;align-items:center;gap:8px}
.switch input{cursor:pointer;flex:0 0 auto}
.skill-row.off{opacity:.55}
.skill-row .grow{min-width:0}
.skill-row .switch{flex:0 0 auto}
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
table.tbl th,table.tbl td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.tbl td:last-child,table.tbl th:last-child{white-space:nowrap}
table.tbl th{color:var(--muted);font-weight:600;font-size:11.5px}
.tag{display:inline-block;font-size:11px;border:1px solid var(--line-strong);border-radius:999px;padding:0 6px;color:var(--muted)}
.tag.destructive{color:var(--danger);border-color:var(--danger)}
.tag.read{border-color:var(--ok);color:var(--ok)}
pre.code{background:var(--bg);border:1px solid var(--line);border-radius:var(--radius-sm);padding:8px;overflow:auto;
  font-family:var(--mono);font-size:12px;margin:6px 0;white-space:pre-wrap;word-break:break-word}
.spnode{border-left:2px solid var(--line);margin-left:6px;padding-left:8px}

/* ---------- 消息 ---------- */
.msg{display:flex;flex-direction:column;gap:4px;max-width:min(860px,92%)}
.msg.user{align-self:flex-end;align-items:flex-end}
.msg .who{font-size:11.5px;color:var(--muted)}
.msg .body{padding:9px 12px;border-radius:var(--radius);background:var(--card);border:1px solid var(--line);
  box-shadow:var(--shadow-1);word-break:break-word}
.msg.user .body{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.msg .body>*:first-child{margin-top:0} .msg .body>*:last-child{margin-bottom:0}
.msg .body p{margin:.4em 0} .msg .body h1,.msg .body h2,.msg .body h3{margin:.6em 0 .3em;font-size:1.08em}
.msg .body ul,.msg .body ol{margin:.3em 0;padding-left:1.3em}
.msg .body code{font-family:var(--mono);font-size:.92em;background:rgba(127,127,127,.14);padding:1px 4px;border-radius:4px}
.msg .body pre{background:var(--bg);border:1px solid var(--line);border-radius:var(--radius-sm);padding:8px;overflow:auto}
.msg .body pre code{background:none;padding:0}
.msg .body blockquote{border-left:3px solid var(--line-strong);margin:.4em 0;padding-left:10px;color:var(--muted)}
.msg .body img{max-width:100%;border-radius:var(--radius-sm)}
.msg.streaming .body::after{content:"▍";animation:blink 1s steps(1) infinite;opacity:.6}
@keyframes blink{50%{opacity:0}}
.msg.system{align-self:center;max-width:100%}
.msg.system .body{background:var(--bg-elev);color:var(--muted);font-size:12.5px;border-style:dashed}
details.tool{border:1px dashed var(--line-strong);border-radius:var(--radius-sm);padding:6px 8px;font-size:12.5px;
  background:var(--card);max-width:min(860px,92%)}
details.tool>summary{cursor:pointer;color:var(--muted);display:flex;gap:6px;align-items:center}
details.tool .err{color:var(--danger)}
.interaction{border:1px solid var(--warn);border-radius:var(--radius);padding:10px;background:var(--card);
  box-shadow:var(--shadow-1);max-width:min(860px,92%)}
.interaction .q{font-weight:600;margin-bottom:6px}
.interaction .row{display:flex;gap:var(--sp2);align-items:center;flex-wrap:wrap;margin-top:8px}
.empty{align-self:center;text-align:center;color:var(--muted);margin:auto;padding:var(--sp5)}
.empty h2{margin:0 0 6px;color:var(--ink)}
.empty .examples{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:var(--sp3)}
.empty .examples button{border:1px solid var(--line-strong);background:var(--card);border-radius:999px;
  padding:5px 12px;cursor:pointer;font-size:12.5px}
.skeleton{height:38px;border-radius:var(--radius);background:linear-gradient(90deg,var(--line),var(--bg-elev),var(--line));
  background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
.banner{display:none;padding:7px 12px;background:var(--danger-soft);color:var(--danger);font-size:12.5px;
  border-bottom:1px solid var(--line)}
.banner.on{display:block}

/* ---------- 通用控件 ---------- */
.btn{border:1px solid var(--line-strong);background:var(--card);border-radius:var(--radius-sm);padding:6px 12px;
  cursor:pointer;font-size:13px;transition:all var(--dur)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{opacity:.92;color:var(--accent-ink)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.icon{padding:5px 8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.muted{color:var(--muted)} .small{font-size:12px}
.row{display:flex;gap:var(--sp2);align-items:center;flex-wrap:wrap}
.grow{flex:1}
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:99;max-width:360px}
.toast{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--radius-sm);
  padding:9px 12px;box-shadow:var(--shadow-2);font-size:12.5px;animation:in .16s ease}
.toast.error{border-left-color:var(--danger)}
.toast.warn{border-left-color:var(--warn)}
@keyframes in{from{transform:translateY(6px);opacity:0}}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.32);display:flex;align-items:center;justify-content:center;z-index:100}
.dialog{background:var(--card);border-radius:var(--radius-lg);padding:var(--sp4);box-shadow:var(--shadow-2);
  max-width:420px;width:calc(100% - 32px)}
.dialog h3{margin:0 0 8px;font-size:15px}
.dialog .row{justify-content:flex-end;margin-top:var(--sp4)}

/* ---------- 响应式 ---------- */
#menuToggle{display:none}
@media (max-width:1100px){
  #app.drawer-open{grid-template-columns:264px minmax(0,1fr) 0}
  #drawer{position:fixed;top:0;right:0;bottom:0;width:min(400px,92vw);z-index:60;box-shadow:var(--shadow-2)}
  #app.drawer-open #drawer{display:flex}
  /* 覆盖层会压住「▤」，关抽屉请用抽屉内的「×」或 Esc */
  #app.drawer-open #drawerToggle{visibility:hidden}
}
@media (max-width:760px){
  #app{grid-template-columns:0 minmax(0,1fr) 0}
  #sidebar{position:fixed;top:0;left:0;bottom:0;width:82vw;max-width:320px;z-index:70;transform:translateX(-100%);
    transition:transform .18s ease;box-shadow:var(--shadow-2)}
  body.side-open #sidebar{transform:none}
  #menuToggle{display:inline-flex}
  #drawer{width:100vw}
  #composer{flex-direction:column;align-items:stretch}
  .msg{max-width:100%}
}
</style>
</head>
<body>
<div id="app">
  <!-- ============ 侧栏 ============ -->
  <aside id="sidebar">
    <div class="side-head">
      <div class="brand"><span class="dot"></span>harness</div>
      <button class="btn icon" id="newSession" title="新建会话（Alt+N）">＋</button>
    </div>
    <div class="side-search"><input id="sessionSearch" type="text" placeholder="搜索会话…"
      style="width:100%;padding:6px 8px;border:1px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--card)"></div>
    <ul id="sessionList"></ul>
    <div class="side-foot">
      <span id="healthLine">—</span>
      <span class="grow"></span>
      <button class="btn icon" id="themeToggle" title="切换深浅主题">◐</button>
    </div>
  </aside>

  <!-- ============ 主区 ============ -->
  <main id="chat">
    <div class="banner" id="offlineBanner">网络已断开，操作可能失败</div>
    <div id="chatHead">
      <button class="btn icon" id="menuToggle" title="会话列表">☰</button>
      <h1 id="chatTitle">新会话</h1>
      <span id="runStatus" aria-live="polite"></span>
      <button class="btn icon" id="drawerToggle" title="面板">▤</button>
    </div>
    <div class="toolbar" id="policy"></div>
    <div id="log"></div>
    <footer id="composer">
      <div id="attach"></div>
      <input type="file" id="fileInput" accept="image/*" multiple hidden />
      <button class="btn icon" id="attachBtn" title="上传图片">🖼</button>
      <textarea id="input" rows="1" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
      <button class="btn" id="stop" hidden>停止</button>
      <button class="btn primary" id="send">发送</button>
    </footer>
  </main>

  <!-- ============ 抽屉 ============ -->
  <aside id="drawer">
    <nav class="tabs" id="tabs">
      <button data-tab="usage" class="on">用量</button>
      <button data-tab="config">配置</button>
      <button data-tab="mcp">MCP</button>
      <button data-tab="skills">技能</button>
      <button data-tab="tools">工具</button>
      <button data-tab="memory">记忆</button>
      <button data-tab="observe">调用链</button>
      <button data-tab="health">状态</button>
      <button id="drawerClose" title="关闭面板（Esc）" aria-label="关闭面板">×</button>
    </nav>
    <div class="panes">
      <section class="pane on" data-pane="usage" id="paneUsage"></section>
      <section class="pane" data-pane="config" id="paneConfig"></section>
      <section class="pane" data-pane="mcp" id="paneMcp"></section>
      <section class="pane" data-pane="skills" id="paneSkills"></section>
      <section class="pane" data-pane="tools" id="paneTools"></section>
      <section class="pane" data-pane="memory" id="paneMemory"></section>
      <section class="pane" data-pane="observe" id="paneObserve"></section>
      <section class="pane" data-pane="health" id="paneHealth"></section>
    </div>
  </aside>
</div>
<div id="toasts" aria-live="polite"></div>

<script>
/* =====================================================================
   0. utils
   ===================================================================== */
const $ = (s, root = document) => root.querySelector(s);
const $$ = (s, root = document) => Array.from(root.querySelectorAll(s));

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}
function safeUrl(u) {
  return /^(https?:|mailto:|\/|#)/i.test(u) ? u : '#';
}
function fmtNum(n) {
  return (n ?? 0).toLocaleString('en-US');
}
function fmtTime(ts) {
  if (!ts) return '—';
  const d = new Date(ts * 1000);
  const diff = (Date.now() - d.getTime()) / 1000;
  if (diff < 60) return '刚刚';
  if (diff < 3600) return `${Math.floor(diff / 60)} 分钟前`;
  if (diff < 86400) return `${Math.floor(diff / 3600)} 小时前`;
  return d.toLocaleDateString('zh-CN');
}
function debounce(fn, ms = 150) {
  let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
}
function toast(msg, kind = 'info') {
  const el = document.createElement('div');
  el.className = `toast ${kind}`;
  el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), kind === 'error' ? 7000 : 4000);
}
function confirmDialog(message, detail = '') {
  return new Promise(resolve => {
    const box = document.createElement('div');
    box.className = 'overlay';
    box.innerHTML = `<div class="dialog"><h3></h3><div class="muted small"></div>
      <div class="row"><button class="btn" data-no>取消</button><button class="btn danger" data-yes>确认</button></div></div>`;
    box.querySelector('h3').textContent = message;
    box.querySelector('.small').textContent = detail;
    box.querySelector('[data-no]').onclick = () => { box.remove(); resolve(false); };
    box.querySelector('[data-yes]').onclick = () => { box.remove(); resolve(true); };
    box.onclick = e => { if (e.target === box) { box.remove(); resolve(false); } };
    document.body.appendChild(box);
  });
}
/* 多行 JSON 输入弹窗：确认返回文本，取消返回 null */
function jsonDialog(title, hint, placeholder = '') {
  return new Promise(resolve => {
    const box = document.createElement('div');
    box.className = 'overlay';
    box.innerHTML = `<div class="dialog" style="max-width:560px">
      <h3></h3><div class="muted small" data-hint></div>
      <textarea data-json rows="12" spellcheck="false"
        style="width:100%;margin-top:8px;font-size:12.5px"></textarea>
      <div class="row"><button class="btn" data-no>取消</button><button class="btn primary" data-yes>导入</button></div></div>`;
    box.querySelector('h3').textContent = title;
    box.querySelector('[data-hint]').textContent = hint;
    const ta = box.querySelector('[data-json]');
    ta.placeholder = placeholder;
    box.querySelector('[data-no]').onclick = () => { box.remove(); resolve(null); };
    box.querySelector('[data-yes]').onclick = () => { const v = ta.value; box.remove(); resolve(v); };
    box.onclick = e => { if (e.target === box) { box.remove(); resolve(null); } };
    document.body.appendChild(box);
    ta.focus();
  });
}

/* ---- 零依赖安全 Markdown（先转义，后替换）---- */
function mdInline(s) {
  return s
    .replace(/`([^`]+)`/g, (m, p) => `<code>${p}</code>`)
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>')
    .replace(/~~([^~]+)~~/g, '<del>$1</del>')
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,
      (m, t, u) => `<a href="${safeUrl(u)}" target="_blank" rel="noopener noreferrer">${t}</a>`);
}
function renderMarkdown(src) {
  const blocks = [];
  let text = String(src ?? '').replace(/\r\n?/g, '\n');
  text = text.replace(/```([A-Za-z0-9+#.-]*)\n([\s\S]*?)```/g, (m, lang, code) => {
    blocks.push({ lang: lang || '', code });
    return `\u0000B${blocks.length - 1}\u0000`;
  });
  text = esc(text);
  const out = [];
  let list = null, para = [];
  const closeList = () => { if (list) { out.push(`</${list}>`); list = null; } };
  const flushPara = () => { if (para.length) { out.push(`<p>${mdInline(para.join('<br>'))}</p>`); para = []; } };
  for (const raw of text.split('\n')) {
    const line = raw.replace(/[ \t]+$/, '');
    let m;
    if ((m = line.match(/^(#{1,6})\s+(.*)$/))) { closeList(); flushPara(); const lv = m[1].length; out.push(`<h${lv}>${mdInline(m[2])}</h${lv}>`); continue; }
    if (/^\s*(?:-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { closeList(); flushPara(); out.push('<hr>'); continue; }
    if ((m = line.match(/^\s*[-*+]\s+(.*)$/))) { flushPara(); if (list !== 'ul') { closeList(); out.push('<ul>'); list = 'ul'; } out.push(`<li>${mdInline(m[1])}</li>`); continue; }
    if ((m = line.match(/^\s*\d+\.\s+(.*)$/))) { flushPara(); if (list !== 'ol') { closeList(); out.push('<ol>'); list = 'ol'; } out.push(`<li>${mdInline(m[1])}</li>`); continue; }
    if ((m = line.match(/^&gt;\s?(.*)$/))) { closeList(); flushPara(); out.push(`<blockquote>${mdInline(m[1])}</blockquote>`); continue; }
    if (!line.trim()) { closeList(); flushPara(); continue; }
    para.push(line);
  }
  closeList(); flushPara();
  return out.join('\n').replace(/\u0000B(\d+)\u0000/g, (m, i) => {
    const b = blocks[+i];
    const lang = (b.lang || '').replace(/[^A-Za-z0-9+#.-]/g, '');
    return `<pre><code${lang ? ` class="lang-${lang}"` : ''}>${esc(b.code)}</code></pre>`;
  });
}

/* =====================================================================
   1. state
   ===================================================================== */
const TABS = ['usage', 'config', 'mcp', 'skills', 'tools', 'memory', 'observe', 'health'];
const LS = {
  sid: 'harness.sid', theme: 'harness.theme', scopes: 'harness.scopes',
  tab: 'harness.tab', drawer: 'harness.drawer',
  workspace: 'harness.workspace', permission: 'harness.permission',
};
// 三档权限（与 harness/tool/permission.py 同值）：档位 → scopes + 审批行为的映射在服务端
const PERMISSIONS = ['read', 'write', 'write_free'];
const PERMISSION_LABELS = { read: '只读', write: '读写 · 需批准', write_free: '读写 · 免批准' };
const _savedTab = localStorage.getItem(LS.tab);
const S = {
  sessionId: null, sessions: [], runId: null, running: false, lastSeq: 0,
  detail: null, usageTurn: null, lastRunId: null,
  config: null, effective: null, envOverrides: [],
  // 兼容旧语义：会话**没设档位**时仍按这套 scopes 走（只读），行为与改造前一致
  scopes: new Set(JSON.parse(localStorage.getItem(LS.scopes) || '["fs:read"]')),
  // 会话设置（#policy 控件）：本会话优先取会话 metadata，取不到就用这两个「默认值」
  workspace: localStorage.getItem(LS.workspace) || '',
  permission: PERMISSIONS.includes(localStorage.getItem(LS.permission))
    ? localStorage.getItem(LS.permission) : 'read',
  theme: localStorage.getItem(LS.theme) || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'),
  tab: TABS.includes(_savedTab) ? _savedTab : 'usage',
  drawer: localStorage.getItem(LS.drawer) === '1',
  files: [],       // 待发送图片（data URL）
  toolIndex: {},   // name -> spec
  interruptQueue: [], // 软打断后待续发的用户输入（按顺序一条条发）
};

/* =====================================================================
   2. api
   ===================================================================== */
class ApiError extends Error {
  constructor(code, message, details) { super(message); this.code = code; this.details = details || {}; }
}
async function parseResponse(res) {
  if (res.status === 204) return null;
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch { /* 非 JSON */ }
  if (!res.ok) {
    const err = (data && data.error) || {};
    throw new ApiError(err.code || `http_${res.status}`, err.message || text || res.statusText, err.details);
  }
  return data;
}
async function request(method, path, body) {
  let res;
  try {
    res = await fetch(path, {
      method,
      headers: body === undefined ? undefined : { 'Content-Type': 'application/json' },
      body: body === undefined ? undefined : JSON.stringify(body),
    });
  } catch (e) { throw new ApiError('network_error', '网络请求失败：' + e.message); }
  return parseResponse(res);
}
/* zip 上传：raw body（不走 multipart，后端也就无需 python-multipart 依赖） */
async function uploadFile(path, file) {
  let res;
  try {
    res = await fetch(path, {
      method: 'POST',
      headers: { 'Content-Type': file.type || 'application/zip' },
      body: file,
    });
  } catch (e) { throw new ApiError('network_error', '网络请求失败：' + e.message); }
  return parseResponse(res);
}
const api = {
  get: p => request('GET', p),
  post: (p, b) => request('POST', p, b === undefined ? {} : b),
  put: (p, b) => request('PUT', p, b),
  patch: (p, b) => request('PATCH', p, b),
  del: p => request('DELETE', p),
  upload: (p, f) => uploadFile(p, f),
};

/* =====================================================================
   3. 消息渲染
   ===================================================================== */
function bubble(role, content, { streaming = false } = {}) {
  const wrap = document.createElement('div');
  wrap.className = `msg ${role}${streaming ? ' streaming' : ''}`;
  const who = document.createElement('div');
  who.className = 'who';
  who.textContent = role === 'user' ? '我' : role === 'assistant' ? '助手' : '系统';
  const body = document.createElement('div');
  body.className = 'body';
  body.textContent = content || '';
  wrap.append(who, body);
  return wrap;
}
function setRich(body, text) { body.innerHTML = renderMarkdown(text || ''); }

function toolCard(items) {
  const box = document.createElement('details');
  box.className = 'tool';
  const names = items.map(i => i.name || i.tool_call_id.slice(0, 8)).join(', ');
  const summary = document.createElement('summary');
  summary.textContent = `工具结果 · ${names}`;
  box.appendChild(summary);
  for (const item of items) {
    const pre = document.createElement('pre');
    pre.className = 'code';
    pre.textContent = item.content || '(空)';
    box.appendChild(pre);
  }
  return box;
}

function interactionCard(ev) {
  const box = document.createElement('div');
  box.className = 'interaction';
  if (ev.kind === 'ask') {
    box.innerHTML = `<div class="q"></div><div class="row">
      <input type="text" class="grow" style="padding:6px 8px;border:1px solid var(--line-strong);border-radius:6px" placeholder="输入回答…">
      <button class="btn primary" data-ok>回答</button></div>`;
    box.querySelector('.q').textContent = ev.question || '（提问）';
    if (ev.options && ev.options.length) {
      const row = box.querySelector('.row');
      for (const opt of ev.options) {
        const b = document.createElement('button');
        b.className = 'btn'; b.textContent = opt;
        b.onclick = () => { box.querySelector('input').value = opt; };
        row.prepend(b);
      }
    }
  } else {
    box.innerHTML = `<div class="q">需要批准：<code></code></div>
      <div class="small muted"></div>
      <details><summary class="small muted" style="cursor:pointer">参数</summary><pre class="code"></pre></details>
      <div class="row"><button class="btn danger" data-no>拒绝</button>
      <button class="btn primary" data-ok>批准</button></div>`;
    box.querySelector('code').textContent = ev.tool || '';
    box.querySelector('.small').textContent = ev.reason || '该工具被标记为危险操作';
    box.querySelector('pre').textContent = JSON.stringify(ev.args ?? {}, null, 2);
  }
  const finish = async (payload) => {
    try {
      await api.post(`/interactions/${ev.id}`, payload);
      $$('button', box).forEach(b => { b.disabled = true; });
      box.querySelector('.q').textContent += '（已提交）';
    } catch (e) { toast(e.message, 'error'); }
  };
  const ok = box.querySelector('[data-ok]');
  if (ok) ok.onclick = () => finish(ev.kind === 'ask'
    ? { answer: box.querySelector('input').value }
    : { approved: true });
  const no = box.querySelector('[data-no]');
  if (no) no.onclick = () => finish({ approved: false });
  return box;
}

function renderHistory(messages) {
  const log = $('#log');
  log.innerHTML = '';
  for (const m of messages) {
    if (m.role === 'system') {
      // 只展示摘要与自定义 system（会话自身的系统分组），其余折叠掉
      const text = typeof m.content === 'string' ? m.content : '';
      if (!text) continue;
      const b = bubble('system', text);
      log.appendChild(b);
      continue;
    }
    if (m.role === 'tool') {
      log.appendChild(toolCard([{ name: m.name, tool_call_id: m.tool_call_id, content: m.content }]));
      continue;
    }
    if (m.role === 'assistant') {
      let text = '';
      if (typeof m.content === 'string') text = m.content;
      else if (Array.isArray(m.content)) text = m.content.map(p => p.text || '').join('');
      if (text) { const b = bubble('assistant', ''); setRich(b.querySelector('.body'), text); log.appendChild(b); }
      if (m.tool_calls && m.tool_calls.length) {
        const box = document.createElement('details');
        box.className = 'tool';
        box.innerHTML = `<summary>调用工具 · ${m.tool_calls.map(t => t.function?.name || '?').join(', ')}</summary>`;
        const pre = document.createElement('pre'); pre.className = 'code';
        pre.textContent = JSON.stringify(m.tool_calls, null, 2);
        box.appendChild(pre); log.appendChild(box);
      }
      continue;
    }
    // user
    let text = '', imgs = [];
    if (typeof m.content === 'string') text = m.content;
    else if (Array.isArray(m.content)) {
      for (const p of m.content) {
        if (p.type === 'text') text += p.text || '';
        else if (p.type === 'image_url') imgs.push(p.image_url?.url);
      }
    }
    const b = bubble('user', '');
    const body = b.querySelector('.body');
    if (text) { const div = document.createElement('div'); div.textContent = text; body.appendChild(div); }
    for (const url of imgs) { const img = document.createElement('img'); img.src = url; body.appendChild(img); }
    log.appendChild(b);
  }
  log.scrollTop = log.scrollHeight;
}

/* =====================================================================
   4. 会话
   ===================================================================== */
async function loadSessions() {
  try {
    S.sessions = (await api.get('/sessions')) || [];
    renderSessionList();
  } catch (e) { toast('会话列表加载失败：' + e.message, 'error'); }
}
function renderSessionList() {
  const q = ($('#sessionSearch').value || '').trim().toLowerCase();
  const list = $('#sessionList');
  list.innerHTML = '';
  const items = S.sessions.filter(s =>
    !q || (s.title || '').toLowerCase().includes(q) || s.session_id.includes(q));
  if (!items.length) {
    const li = document.createElement('li');
    li.className = 'muted small';
    li.style.padding = '10px';
    li.textContent = S.sessions.length ? '没有匹配的会话' : '还没有会话';
    list.appendChild(li);
    return;
  }
  for (const s of items) {
    const li = document.createElement('li');
    li.className = 'session-item' + (s.session_id === S.sessionId ? ' active' : '');
    li.dataset.id = s.session_id;
    const t = document.createElement('div'); t.className = 't';
    const span = document.createElement('span'); span.className = 'grow'; span.style.overflow = 'hidden';
    span.style.textOverflow = 'ellipsis'; span.textContent = s.title || `会话 ${s.session_id.slice(0, 8)}`;
    t.appendChild(span);
    if (s.active_run_id) { const p = document.createElement('span'); p.className = 'pulse'; t.appendChild(p); }
    const acts = document.createElement('span'); acts.className = 'acts';
    const rn = document.createElement('button'); rn.className = 'btn xs icon'; rn.textContent = '✎'; rn.title = '重命名';
    const dl = document.createElement('button'); dl.className = 'btn xs icon'; dl.textContent = '✕'; dl.title = '删除';
    rn.onclick = (e) => { e.stopPropagation(); startRename(li, s); };
    dl.onclick = (e) => { e.stopPropagation(); deleteCurrentOr(s.session_id); };
    rn.ondblclick = (e) => e.stopPropagation();
    dl.ondblclick = (e) => e.stopPropagation();
    acts.append(rn, dl); t.appendChild(acts);
    const m = document.createElement('div'); m.className = 'm';
    m.innerHTML = `<span>${s.turns || 0} 轮</span><span>${fmtTime(s.updated_at)}</span>`;
    if (s.usage_totals) m.innerHTML += `<span>${fmtNum(s.usage_totals.total_tokens)} tok</span>`;
    li.append(t, m);
    li.onclick = () => openSession(s.session_id);
    li.ondblclick = (e) => { e.preventDefault(); startRename(li, s); };
    list.appendChild(li);
  }
}
async function newSession() {
  S.sessionId = null; S.runId = null; S.lastSeq = 0; S.detail = null; clearPending();
  localStorage.removeItem(LS.sid);
  $('#chatTitle').textContent = '新会话';
  $('#runStatus').textContent = '';
  showEmpty();
  renderAllPanels();
}
function showEmpty() {
  const log = $('#log');
  log.innerHTML = `<div class="empty"><h2>开始对话</h2>
    <div>选择左侧会话，或直接输入消息（会自动新建会话）。</div>
    <div class="examples">
      <button data-ex="读一下 README.md 并总结要点">读 README 并总结</button>
      <button data-ex="用 shell.run 执行 echo hello">执行 echo hello</button>
      <button data-ex="现在几点？">现在几点</button>
    </div></div>`;
  $$('#log .examples button').forEach(b => {
    b.onclick = () => { $('#input').value = b.dataset.ex; $('#input').focus(); };
  });
}
async function ensureSession() {
  if (S.sessionId) return S.sessionId;
  // 新建会话时带上「工作区 + 权限档位」的默认值（无会话时改的只落 localStorage）
  const created = await api.post('/sessions', {
    metadata: { workspace: S.workspace || '', permission: S.permission || 'read' },
  });
  S.sessionId = created.session_id;
  localStorage.setItem(LS.sid, S.sessionId);
  S.sessions.unshift(created);
  renderSessionList();
  return S.sessionId;
}
async function openSession(id) {
  if (S.sessionId === id && S.detail) { closeSidebarOnMobile(); return; }
  S.sessionId = id; S.lastSeq = 0; S.runId = null; S.usageTurn = null; clearPending();
  localStorage.setItem(LS.sid, id);
  closeSidebarOnMobile();
  $('#log').innerHTML = '<div class="skeleton"></div><div class="skeleton"></div>';
  try {
    const [detail, msgs] = await Promise.all([
      api.get(`/sessions/${id}`),
      api.get(`/sessions/${id}/messages`),
    ]);
    S.detail = detail;
    $('#chatTitle').textContent = detail.title || `会话 ${id.slice(0, 8)}`;
    renderHistory(msgs.messages || []);
    renderSessionList();
    renderAllPanels();
    // 重连正在跑的 run
    if (detail.active_run_id) {
      streamRun(detail.active_run_id, { resume: true });
    }
  } catch (e) {
    toast('打开会话失败：' + e.message, 'error');
    $('#log').innerHTML = '';
    showEmpty();
  }
}
function startRename(li, s) {
  const titleEl = li.querySelector('.t');
  const input = document.createElement('input');
  input.type = 'text'; input.value = s.title || '';
  input.style.cssText = 'width:100%;padding:2px 6px;border:1px solid var(--accent);border-radius:4px';
  titleEl.replaceChildren(input);
  input.focus(); input.select();
  const commit = async () => {
    const title = input.value.trim();
    input.onblur = null;
    if (!title || title === s.title) { renderSessionList(); return; }
    try {
      const updated = await api.patch(`/sessions/${s.session_id}`, { title });
      s.title = updated.title;
      if (s.session_id === S.sessionId) { $('#chatTitle').textContent = updated.title; S.detail = updated; }
      toast('已重命名');
    } catch (e) { toast(e.message, 'error'); }
    renderSessionList();
  };
  input.onblur = commit;
  input.onkeydown = (e) => {
    if (e.key === 'Enter') { e.preventDefault(); commit(); }
    if (e.key === 'Escape') { input.onblur = null; renderSessionList(); }
  };
}
async function deleteCurrentOr(id) {
  const ok = await confirmDialog('删除这个会话？', '该操作不可撤销，会话事件日志会被移除。');
  if (!ok) return;
  try {
    await api.del(`/sessions/${id}`);
    S.sessions = S.sessions.filter(s => s.session_id !== id);
    if (S.sessionId === id) newSession();
    else renderSessionList();
    toast('已删除');
  } catch (e) { toast(e.message, 'error'); }
}

/* =====================================================================
   5. 对话流（SSE）
   ===================================================================== */
async function send() {
  const input = $('#input');
  const text = input.value.trim();
  if (!text && !S.files.length) return;
  try {
    const sid = await ensureSession();
    const bubbleEl = bubble('user', text);
    const body = bubbleEl.querySelector('.body');
    for (const f of S.files) { const img = document.createElement('img'); img.src = f; body.appendChild(img); }
    $('#log').querySelector('.empty')?.closest('.empty')?.remove();
    $('#log').appendChild(bubbleEl);
    input.value = ''; autoGrow(input);
    const files = S.files.slice(); S.files = []; renderAttach();
    $('#log').scrollTop = $('#log').scrollHeight;

    // 会话设了权限档位 → 由服务端按档位推导 scopes（单一真源）；没设 → 沿用旧语义（只读）
    const level = (S.detail && S.detail.metadata && S.detail.metadata.permission) || '';
    const payload = {
      input: text || '(图片)', stream: true,
      scopes: level ? [] : Array.from(S.scopes),
    };
    if (files.length) payload.images = files;
    const handle = await api.post(`/sessions/${sid}/turns`, payload);
    S.lastRunSession = sid;
    if (handle.interrupt) {
      // 软打断：当前 run 正在跑，服务端会等它把当前工具跑完再收尾，并在 done 里把这条输入带回来
      toast('已收到，当前工具执行完就回应', 'info');
      return;
    }
    streamRun(handle.run_id);
  } catch (e) {
    clearPending();
    if (e.code === 'run_conflict') { toast('该会话的上一轮正在收尾，请稍后重试', 'warn'); }
    else toast('发送失败：' + e.message, 'error');
  }
}

let _es = null, _retry = 0, _assistantEl = null, _assistantText = '', _pendingEl = null;
/* 首字到达前的占位反馈：模型 TTFB 可能长达数秒，期间不能让界面「死寂」 */
function showPending(label) {
  if (_pendingEl) return;
  _pendingEl = bubble('assistant', '');
  _pendingEl.classList.add('pending-msg');
  const body = _pendingEl.querySelector('.body');
  body.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
  const note = document.createElement('span');
  note.className = 'pending-note'; note.textContent = label || '正在等待模型响应…';
  body.appendChild(note);
  const log = $('#log'); log.appendChild(_pendingEl); log.scrollTop = log.scrollHeight;
}
function clearPending() { if (_pendingEl) { _pendingEl.remove(); _pendingEl = null; } }
function setRunning(on) {
  S.running = on;
  // 运行中**不禁用**发送：再发一条就是软打断（提问会排到当前工具执行完之后）
  $('#send').disabled = false;
  $('#send').textContent = on ? '打断并发送' : '发送';
  $('#stop').hidden = !on;
  $('#input').disabled = false;
}
function attachStream(runId) { streamRun(runId); }

/* done 里带回来的排队输入：按顺序依次续发（每条开一个新 run） */
async function resendInterrupt(pending) {
  if (!S.sessionId) return;
  const level = (S.detail && S.detail.metadata && S.detail.metadata.permission) || '';
  const payload = { input: pending.input, stream: true, scopes: level ? [] : Array.from(S.scopes) };
  if (pending.images && pending.images.length) payload.images = pending.images;
  try {
    const handle = await api.post(`/sessions/${S.sessionId}/turns`, payload);
    if (handle.interrupt) return;  // 又被新的插话取代，交给那次的 done 处理
    streamRun(handle.run_id);
  } catch (e) {
    toast(`续发失败，请手动重发：${e.message}`, 'error');
  }
}
async function drainInterrupts(list) {
  const pending = list || [];
  if (!pending.length) return;
  if (pending.length > 1) toast(`${pending.length} 条排队输入将依次发送`, 'info');
  await resendInterrupt(pending[0]);
  // 其余留在队列里，等这一轮 done 再继续（保持顺序，也避免立刻被自己打断）
  if (pending.length > 1) S.interruptQueue = pending.slice(1);
}

function streamRun(runId, { resume = false } = {}) {
  if (_es) { _es.close(); _es = null; }
  S.runId = runId; S.lastRunId = runId;
  if (!resume) { S.lastSeq = 0; _assistantEl = null; _assistantText = ''; showPending('正在等待模型响应…'); }
  setRunning(true);
  $('#runStatus').textContent = '运行中…';
  const url = `/runs/${runId}/events?after=${S.lastSeq}`;
  _es = new EventSource(url);

  const on = (name, fn) => _es.addEventListener(name, (e) => {
    if (e.lastEventId) S.lastSeq = Number(e.lastEventId);
    let data = {};
    try { data = JSON.parse(e.data); } catch { /* ignore */ }
    fn(data);
  });

  on('run_started', () => { _retry = 0; $('#runStatus').textContent = '运行中…'; });
  on('text_delta', (d) => {
    clearPending();
    if (!_assistantEl) {
      _assistantEl = bubble('assistant', '', { streaming: true });
      $('#log').appendChild(_assistantEl);
    }
    _assistantText += d.text || '';
    const body = _assistantEl.querySelector('.body');
    body.textContent = _assistantText;
    $('#log').scrollTop = $('#log').scrollHeight;
  });
  on('message', (d) => {
    clearPending();
    if (d.text && !_assistantText) { _assistantText = d.text; }
  });
  on('tool_finished', (d) => {
    clearPending();
    const items = (d.tool_results || []).map(r => ({ name: r.name, tool_call_id: r.tool_call_id, content: r.content }));
    if (items.length) {
      if (_assistantEl) { _assistantEl.classList.remove('streaming'); _assistantEl = null; _assistantText = ''; }
      $('#log').appendChild(toolCard(items));
      $('#log').scrollTop = $('#log').scrollHeight;
    }
  });
  on('interaction_required', (d) => {
    clearPending();
    if (_assistantEl) { _assistantEl.classList.remove('streaming'); _assistantEl = null; _assistantText = ''; }
    $('#log').appendChild(interactionCard(d));
    $('#log').scrollTop = $('#log').scrollHeight;
  });
  on('run_error', (d) => {
    clearPending();
    const err = (d && d.error) || {};
    const box = bubble('system', '');
    box.classList.add('system');
    box.querySelector('.body').textContent = `运行出错：${err.message || err.type || '未知错误'}`;
    $('#log').appendChild(box);
  });
  on('done', (d) => {
    clearPending();
    if (_assistantEl) {
      _assistantEl.classList.remove('streaming');
      if (_assistantText) setRich(_assistantEl.querySelector('.body'), _assistantText);
      _assistantEl = null; _assistantText = '';
    }
    S.usageTurn = d.usage || null;
    setRunning(false);
    $('#runStatus').textContent = STOP_LABEL[d.stop_reason] || (d.stop_reason || '完成');
    closeStream();
    finishTurn();
    // 排队输入：本轮新收的排在"上一轮剩下的"之后；两者都只按顺序慢慢续发。
    // 用户主动「停止」时服务端刻意不回传 interrupts，这里也就一并清空队列。
    const cancelled = d.stop_reason === 'cancelled';
    const queued = cancelled ? [] : [...(S.interruptQueue || []), ...(d.interrupts || [])];
    S.interruptQueue = [];
    if (queued.length) drainInterrupts(queued);
  });

  _es.onerror = () => {
    if (!_es) return;
    closeStream();
    if (_retry < 4) {
      _retry += 1;
      const wait = 400 * Math.pow(2, _retry - 1);
      $('#runStatus').textContent = `连接中断，重连中 (${_retry}/4)…`;
      setTimeout(() => streamRun(runId, { resume: true }), wait);
    } else {
      $('#runStatus').textContent = '连接中断（run 可能仍在后台执行）';
      setRunning(false);
      toast('事件流中断，可重新打开会话查看结果', 'warn');
    }
  };
}
const STOP_LABEL = { final: '已完成', max_steps: '达到最大步数', token_budget: '超 token 预算',
  loop_detected: '检测到循环', interrupted: '已打断 · 等你的新输入', error: '出错', cancelled: '已取消' };
function closeStream() { if (_es) { _es.close(); _es = null; } }

async function finishTurn() {
  await loadSessions();
  if (S.sessionId) {
    // 标题任务在 done 之后异步跑，两次重取给它留完成窗口
    refreshDetail();
    setTimeout(refreshDetail, 900);
    setTimeout(refreshDetail, 2400);
  }
}
async function refreshDetail() {
  if (!S.sessionId) return;
  try { S.detail = await api.get(`/sessions/${S.sessionId}`); } catch { return; }
  if (S.detail.title) $('#chatTitle').textContent = S.detail.title;
  renderSessionList();

async function cancelRun() {
  if (!S.runId) return;
  try { await api.post(`/runs/${S.runId}/cancel`); $('#runStatus').textContent = '正在取消…'; }
  catch (e) { toast(e.message, 'error'); }
}

const SECRET_RE = /api_?key|token|secret|password/i;
function isSecretPath(path) { return SECRET_RE.test(path); }

function controlFor(path, value) {
  const kind = Array.isArray(value) ? 'array'
    : value === null ? 'null'
    : typeof value === 'object' ? 'object'
    : typeof value;
  const wrap = document.createElement('div');
  wrap.className = 'field';
  const label = document.createElement('label');
  label.textContent = path;
  wrap.appendChild(label);
  let ctl;
  if (kind === 'boolean') {
    wrap.innerHTML = '';
    const row = document.createElement('div'); row.className = 'switch';
    ctl = document.createElement('input'); ctl.type = 'checkbox'; ctl.checked = value;
    const span = document.createElement('span'); span.className = 'small'; span.textContent = '启用';
    row.append(ctl, span); wrap.append(label, row);
  } else if (kind === 'number') {
    ctl = document.createElement('input'); ctl.type = 'number'; ctl.value = value;
    wrap.appendChild(ctl);
  } else if (kind === 'array' && value.every(v => typeof v === 'string')) {
    ctl = document.createElement('textarea'); ctl.value = value.join('\n');
    const hint = document.createElement('div'); hint.className = 'hint'; hint.textContent = '一行一项';
    wrap.append(ctl, hint);
  } else if (kind === 'object' || kind === 'array' || kind === 'null') {
    ctl = document.createElement('textarea');
    ctl.value = kind === 'null' ? '' : JSON.stringify(value, null, 2);
    const hint = document.createElement('div'); hint.className = 'hint';
    hint.textContent = kind === 'null' ? '留空 = null' : 'JSON';
    wrap.append(ctl, hint);
  } else {
    ctl = document.createElement('input');
    ctl.type = isSecretPath(path) ? 'password' : 'text';
    ctl.value = value ?? '';
    wrap.appendChild(ctl);
  }
  ctl.dataset.path = path;
  ctl.dataset.kind = kind;
  if (isSecretPath(path)) {
    const hint = document.createElement('div'); hint.className = 'hint';
    hint.textContent = '留空或 *** 表示不改；真实密钥放在 .env，这里只写 ${VAR} 引用';
    wrap.appendChild(hint);
  }
  return wrap;
}

function readConfigForm() {
  const out = {};
  const setPath = (obj, path, val) => {
    const parts = path.split('.');
    let node = obj;
    for (const p of parts.slice(0, -1)) node = (node[p] ??= {});
    node[parts.at(-1)] = val;
  };
  for (const ctl of $$('#paneConfig [data-path]')) {
    const path = ctl.dataset.path, kind = ctl.dataset.kind;
    let val;
    if (kind === 'boolean') val = ctl.checked;
    else if (kind === 'number') val = ctl.value === '' ? null : Number(ctl.value);
    else if (kind === 'array') {
      const lines = ctl.value.split('\n').map(s => s.trim()).filter(Boolean);
      try { val = JSON.parse(ctl.value); } catch { val = lines; }
      if (!Array.isArray(val)) val = lines;
    } else if (kind === 'object' || kind === 'array') {
      try { val = JSON.parse(ctl.value); } catch (e) { throw new ApiError('invalid_json', `${path} 不是合法 JSON：${e.message}`); }
    } else if (kind === 'null') {
      val = ctl.value.trim() === '' ? null : ctl.value;
    } else {
      val = ctl.value;
    }
    setPath(out, path, val);
  }
  return out;
}
async function saveConfig() {
  let config;
  try { config = readConfigForm(); }
  catch (e) { return toast(e.message, 'error'); }
  try {
    const res = await api.put('/config', { config, reload: true });
    applyConfigResponse(res);
    toast('已保存并重建');
    (res.warnings || []).forEach(w => toast(w, 'warn'));
    await loadSessions();
    if (S.sessionId) refreshDetail();
  } catch (e) {
    if (e.code === 'config_reload_conflict') {
      const ok = await confirmDialog('有 run 正在执行', '配置重建会中断它。取消全部 run 后重试？');
      if (ok) {
        for (const s of S.sessions) if (s.active_run_id) { try { await api.post(`/runs/${s.active_run_id}/cancel`); } catch {} }
        setTimeout(saveConfig, 600);

    if (e.code === 'config_invalid' && e.details?.path) {
      const ctl = $(`#paneConfig [data-path="${CSS.escape(e.details.path)}"]`);
      if (ctl) { ctl.closest('.field')?.classList.add('invalid'); ctl.scrollIntoView({ block: 'center' }); }
      return toast(`${e.details.path}: ${e.message}`, 'error');
    }
    toast(e.message, 'error');
  }
}

  sel.onchange = () => applyPolicy({ permission: sel.value });
  box.append(l2, sel);

  if (!S.sessionId) {
    const hint = document.createElement('span');
    hint.className = 'hint';
    hint.textContent = '新会话默认值（当前无会话）';
    box.appendChild(hint);
  }
}

// 改设置：先落本地默认值，再按会话落库（无会话时只改默认值，新建时带上）
async function applyPolicy(patch) {
  if ('permission' in patch) {
    S.permission = PERMISSIONS.includes(patch.permission) ? patch.permission : 'read';
    localStorage.setItem(LS.permission, S.permission);
  }
  if ('workspace' in patch) {
    S.workspace = patch.workspace || '';
    localStorage.setItem(LS.workspace, S.workspace);
  }
  renderSessionPolicy();
  if (!S.sessionId) return;
  try {
    const updated = await api.patch(`/sessions/${S.sessionId}`, { metadata: patch });
    S.detail = updated;
    S.sessions = S.sessions.map(s => (s.session_id === updated.session_id ? { ...s, ...updated } : s));
    toast('已更新会话设置');
  } catch (e) {
    if (e.code === 'run_conflict') toast('会话正在回复，稍后再改', 'warn');
    else toast('会话设置失败：' + e.message, 'error');
    // 回滚显示：以服务端为准重新拉一次
    try { S.detail = await api.get(`/sessions/${S.sessionId}`); } catch { /* 保持原样 */ }
  }
  renderSessionPolicy();
}

/* ---------- MCP 结构化编辑 ---------- */
const MCP_TRANSPORTS = ['stdio', 'http'];
const MCP_SIDE_EFFECTS = ['read', 'write', 'destructive'];

function _lines(value) {
  if (Array.isArray(value)) return value.join('\n');
  return '';
}
function _envLines(value) {
  if (!value || typeof value !== 'object') return '';
  return Object.entries(value).map(([k, v]) => `${k}=${v}`).join('\n');
}
function _mcpField(label, key, index, value, kind = 'text', hint = '') {
  const wrap = document.createElement('div');
  wrap.className = 'field';
  const lab = document.createElement('label'); lab.textContent = label;
  let ctl;
  if (kind === 'bool') {
    const row = document.createElement('div'); row.className = 'switch';
    ctl = document.createElement('input'); ctl.type = 'checkbox'; ctl.checked = !!value;
    const span = document.createElement('span'); span.className = 'small'; span.textContent = hint || '是';
    row.append(ctl, span); wrap.append(lab, row);
  } else if (kind === 'select') {
    ctl = document.createElement('select');
    for (const opt of hint) {
      const o = document.createElement('option'); o.value = opt; o.textContent = opt;
      ctl.appendChild(o);
    }
    ctl.value = value ?? hint[0];
    wrap.append(lab, ctl);
  } else if (kind === 'lines' || kind === 'env' || kind === 'json') {
    ctl = document.createElement('textarea');
    ctl.value = kind === 'env' ? _envLines(value)
      : kind === 'json' ? (value && Object.keys(value).length ? JSON.stringify(value, null, 2) : '')
      : _lines(value);
    const h = document.createElement('div'); h.className = 'hint';
    h.textContent = kind === 'env' ? '每行 KEY=VALUE' : kind === 'json' ? 'JSON（对象）' : '一行一项';
    wrap.append(lab, ctl, h);
  } else {
    ctl = document.createElement('input');
    ctl.type = kind === 'num' ? 'number' : 'text';
    ctl.value = value ?? '';
    wrap.append(lab, ctl);
  }
  ctl.dataset.i = String(index);
  ctl.dataset.k = key;
  ctl.dataset.kind = kind;
  return wrap;
}
function _readMcpForm() {
  const servers = [];
  for (const ctl of $$('#paneMcp [data-i]')) {
    const i = Number(ctl.dataset.i), k = ctl.dataset.k, kind = ctl.dataset.kind;
    servers[i] = servers[i] || {};
    if (kind === 'bool') servers[i][k] = ctl.checked;
    else if (kind === 'num') servers[i][k] = ctl.value === '' ? null : Number(ctl.value);
    else if (kind === 'lines') servers[i][k] = ctl.value.split('\n').map(s => s.trim()).filter(Boolean);
    else if (kind === 'env') {
      const env = {};
      for (const line of ctl.value.split('\n').map(s => s.trim()).filter(Boolean)) {
        const at = line.indexOf('=');
        if (at < 0) env[line] = ''; else env[line.slice(0, at).trim()] = line.slice(at + 1).trim();
      }
      servers[i][k] = env;
    } else if (kind === 'json') {
      const text = ctl.value.trim();
      if (!text) { servers[i][k] = {}; continue; }
      try { servers[i][k] = JSON.parse(text); }
      catch (e) { throw new ApiError('invalid_json', `tool_overrides 不是合法 JSON：${e.message}`); }
    } else if (kind === 'select') servers[i][k] = ctl.value;
    else servers[i][k] = ctl.value === '' ? null : ctl.value;
  }
  return servers;
}

/* ---- 粘贴 JSON 导入 MCP server ---- */
// 只保留后端 McpServerConfig 认识的字段；不认识的（如 headers）会被忽略
const MCP_SERVER_KEYS = ['name', 'enabled', 'transport', 'command', 'args', 'env', 'cwd', 'url',
  'tool_prefix', 'default_side_effect', 'default_requires_approval', 'default_scopes',
  'default_timeout_s', 'tool_overrides'];
function _normalizeMcpServer(raw) {
  if (!raw || typeof raw !== 'object' || Array.isArray(raw)) {
    throw new ApiError('invalid_server', '每个 server 必须是一个 JSON 对象');
  }
  const out = {};
  for (const k of MCP_SERVER_KEYS) if (raw[k] !== undefined && raw[k] !== null) out[k] = raw[k];
  out.name = String(out.name || '').trim();
  if (!out.name) throw new ApiError('invalid_server', '缺少 name');
  // 兼容 Claude / Cursor 风格：type（http/sse/streamable-http）→ transport；有 url 即 http
  const type = String(raw.type || raw.transport || '').toLowerCase();
  const isHttp = ['http', 'sse', 'streamable-http', 'streamable_http'].includes(type) || !!raw.url;
  if (!out.transport) out.transport = isHttp ? 'http' : 'stdio';
  if (raw.disabled === true) out.enabled = false;
  // 轻量类型矫正，避免后端 coerce 报错
  if (out.args != null && !Array.isArray(out.args)) out.args = String(out.args).split(/\s+/).filter(Boolean);
  if (out.env != null && (typeof out.env !== 'object' || Array.isArray(out.env))) out.env = {};
  if (out.default_scopes != null && !Array.isArray(out.default_scopes)) out.default_scopes = [];
  if (out.tool_overrides != null && (typeof out.tool_overrides !== 'object' || Array.isArray(out.tool_overrides))) out.tool_overrides = {};
  // 与后端一致的必填校验，提前报错（别等 PUT /config 才失败）
  if (out.transport === 'http' && !out.url) throw new ApiError('invalid_server', `「${out.name}」transport=http 但缺少 url`);
  if (out.transport === 'stdio' && !out.command) throw new ApiError('invalid_server', `「${out.name}」transport=stdio 但缺少 command`);
  return out;
}
function _parseMcpJson(text) {
  const data = JSON.parse(text);
  const found = [];
  const fromMap = obj => {
    for (const [name, cfg] of Object.entries(obj || {})) {
      if (cfg && typeof cfg === 'object' && !Array.isArray(cfg)) found.push({ ...cfg, name: cfg.name || name });
    }
  };
  const fromList = list => { for (const item of list) found.push({ ...(item || {}) }); };
  if (Array.isArray(data)) {
    fromList(data);
  } else if (data && typeof data === 'object') {
    if (data.mcpServers && typeof data.mcpServers === 'object') fromMap(data.mcpServers);
    else if (data.mcp && typeof data.mcp === 'object' && data.mcp.servers) {
      Array.isArray(data.mcp.servers) ? fromList(data.mcp.servers) : fromMap(data.mcp.servers);
    } else if (Array.isArray(data.servers)) fromList(data.servers);
    else if (data.servers && typeof data.servers === 'object') fromMap(data.servers);
    else found.push({ ...data });  // 单个 server 对象
  }
  if (!found.length) throw new ApiError('invalid_json', '没解析出任何 MCP server');
  return found.map(_normalizeMcpServer);
}
async function importMcpJson() {
  const text = await jsonDialog(
    '粘贴 MCP 配置（JSON）',
    '支持：{"mcpServers":{…}} / {"mcp":{"servers":[… …]}} / 数组 / 单个 server。同名覆盖、其余追加；'
      + '不认识的字段（如 headers）会被忽略。导入后点「保存并重连」才生效。',
    '{\n  "mcpServers": {\n    "parallel-search": { "url": "https://search.parallel.ai/mcp" }\n  }\n}'
  );
  if (text == null || !text.trim()) return;
  try {
    const imported = _parseMcpJson(text);
    const cur = _readMcpForm();
    const incoming = new Map(imported.map(s => [s.name, s]));
    const existing = new Set(cur.map(s => s.name));
    const merged = cur.map(s => incoming.has(s.name) ? incoming.get(s.name) : s);
    for (const s of imported) if (!existing.has(s.name)) merged.push(s);
    S.config.mcp = { ...(S.config.mcp || {}), servers: merged };
    loadMcpPanel();
    toast(`已导入 ${imported.length} 个 server，点「保存并重连」生效`);
  } catch (e) {
    toast(e instanceof SyntaxError ? `JSON 解析失败：${e.message}` : e.message, 'error');
  }
}
async function saveMcp() {
  if (!S.config) return toast('配置不可用，无法保存 MCP', 'error');
  let servers;
  try { servers = _readMcpForm(); }
  catch (e) { return toast(e.message, 'error'); }
  const payload = JSON.parse(JSON.stringify(S.config));
  payload.mcp = { ...(payload.mcp || {}), servers };
  try {
    const res = await api.put('/config', { config: payload, reload: true });
    applyConfigResponse(res, { refreshTools: false });
    (res.warnings || []).forEach(w => toast(w, 'warn'));
    toast(`已保存 ${servers.length} 个 MCP server 并重连`);
    await loadTools();
    loadMcpPanel();
  } catch (e) {
    if (e.code === 'config_reload_conflict') return toast('有 run 正在执行，稍后再试', 'warn');
    if (e.code === 'config_invalid') return toast(`${e.details?.path || ''} ${e.message}`, 'error');
    toast(e.message, 'error');
  }
}
