  el.innerHTML = ''; el.appendChild(wrap);
}

/* 一键启用 / 停用 MCP server：只翻 harness.yaml 的 mcp.servers[].enabled 并只重连 MCP */
async function toggleMcp(index, name, enabled) {
  try {
    const r = await api.patch(`/mcp/${encodeURIComponent(name)}`, { enabled });
    (r.warnings || []).forEach(w => toast(w, 'warn'));
    toast(`${name} 已${enabled ? '启用' : '停用'}`);
    if (S.config?.mcp?.servers?.[index]) S.config.mcp.servers[index].enabled = enabled;
    await loadTools();
    loadMcpPanel();
  } catch (e) {
    toast(e.message, 'error');
    loadMcpPanel();
  }
}

/* ---------- 技能 CRUD ---------- */
function _skillIssueList(issues) {
  if (!issues || !issues.length) return '<div class="small" style="color:var(--ok)">校验通过，没有问题</div>';
  return `<ul class="issues">${issues.map(i =>
    `<li class="${i.level === 'error' ? 'err' : 'warn'}">[${esc(i.level)}] ${esc(i.skill)}: ${esc(i.message)} <span class="muted">(${esc(i.code)})</span></li>`
  ).join('')}</ul>`;
}
async function loadSkillsPanel() {
  const el = $('#paneSkills');
  const root = S.config?.skills?.root;
  if (S.config && !String(root || '').trim()) {
    el.innerHTML = `<div class="card">
      <h3>技能未启用</h3>
      <div class="small muted">当前 <code>skills.root</code> 为空。填入一个目录即可启用（相对启动目录，不存在会自动创建）。</div>
      <div class="field" style="margin-top:8px"><label>skills.root</label>
        <input id="skillRoot" type="text" placeholder="skills" style="padding:6px 8px;border:1px solid var(--line-strong);border-radius:6px;background:var(--bg-elev)"></div>
      <div class="editor-toolbar"><button class="btn primary" id="saveRoot">启用并保存</button></div>
    </div>`;
    $('#saveRoot').onclick = async () => {
      const value = $('#skillRoot').value.trim();
      if (!value) return toast('请填写目录', 'warn');
      const payload = JSON.parse(JSON.stringify(S.config));
      payload.skills = { ...(payload.skills || {}), root: value };
      try {
        const res = await api.put('/config', { config: payload, reload: true });
        applyConfigResponse(res, { refreshTools: false });
        toast('技能已启用');
        loadSkillsPanel();
      } catch (e) { toast(e.message, 'error'); }
    };
    return;
  }

  let skills = [], issues = [];
  try {
    [skills, issues] = await Promise.all([
      api.get('/skills'),
      api.get('/skills/lint').then(r => r.issues || []).catch(() => []),
    ]);
  } catch (e) { el.innerHTML = `<div class="card" style="color:var(--danger)">${esc(e.message)}</div>`; return; }
  S.skillIndex = skills;
  S.skillIssues = issues;

  const bySkill = {};
  for (const i of issues) (bySkill[i.skill] = bySkill[i.skill] || []).push(i);

  const list = skills.map(s => {
    const bad = (bySkill[s.name] || []).filter(i => i.level === 'error').length;
    const warn = (bySkill[s.name] || []).filter(i => i.level === 'warning').length;
    const off = s.enabled === false;
    return `<div class="row skill-row${off ? ' off' : ''}" style="border-bottom:1px solid var(--line);padding:6px 0">
      <span class="grow"><b>${esc(s.name)}</b>${off ? ' <span class="tag">已停用</span>' : ''}${bad ? ` <span class="tag destructive">${bad} 错</span>` : ''}${warn ? ` <span class="tag">${warn} 警告</span>` : ''}
        <div class="small muted">${esc(s.description || '')}</div></span>
      <label class="switch" title="${off ? '启用' : '停用'}"><input type="checkbox" data-toggle="${esc(s.name)}" ${off ? '' : 'checked'}></label>
      <button class="btn xs" data-edit="${esc(s.name)}">编辑</button>
    </div>`;
  }).join('') || '<div class="muted small">还没有技能</div>';

  el.innerHTML = `<div class="card">
      <h3>技能（${skills.length}）</h3>
      <div class="small muted">目录：<code>${esc(String(root))}</code></div>
      <div style="margin-top:8px">${list}</div>
      <div class="editor-toolbar">
        <button class="btn" id="newSkill">＋ 新建技能</button>
        <button class="btn" id="uploadSkill">⇪ 上传 zip</button>
        <button class="btn" id="reloadSkills">重新扫描</button>
        <button class="btn" id="lintAll">跑一遍 lint</button>
        <input type="file" id="skillZip" accept=".zip,application/zip" hidden>
      </div>
      ${issues.length ? `<details style="margin-top:8px"><summary class="small muted">全部 lint 问题（${issues.length}）</summary>${_skillIssueList(issues)}</details>` : '<div class="small" style="color:var(--ok);margin-top:6px">全部技能校验通过</div>'}
    </div>
    <div class="card" id="skillEditor"><h3>编辑器</h3><div class="muted small">选择左侧技能编辑，或点「新建技能」。</div></div>`;

  $$('#paneSkills [data-edit]').forEach(b => { b.onclick = () => openSkillEditor(b.dataset.edit); });
  $$('#paneSkills [data-toggle]').forEach(box => { box.onchange = () => toggleSkill(box.dataset.toggle, box.checked); });
  $('#newSkill').onclick = () => openSkillEditor(null);
  $('#uploadSkill').onclick = () => $('#skillZip').click();
  $('#skillZip').onchange = (e) => { const f = e.target.files[0]; e.target.value = ''; if (f) uploadSkillZip(f); };
  $('#reloadSkills').onclick = async () => {
    try { const r = await api.post('/skills/reload'); (r.warnings || []).forEach(w => toast(w, 'warn')); toast('已重载'); loadSkillsPanel(); }
    catch (e) { toast(e.message, 'error'); }
  };
  $('#lintAll').onclick = () => loadSkillsPanel();
}

/* 一键启用 / 停用：只翻 harness.yaml 的 skills.disabled（不重建任何部件，运行中也能切） */
async function toggleSkill(name, enabled) {
  try {
    const r = await api.patch(`/skills/${encodeURIComponent(name)}`, { enabled });
    toast(`${name} 已${enabled ? '启用' : '停用'}`);
    if (r.disabled) S.skillDisabled = r.disabled;
    await loadSkillsPanel();
  } catch (e) {
    toast(e.message, 'error');
    await loadSkillsPanel();
  }
}
/* 上传 zip：同名冲突时先确认再带 overwrite=true 重传 */
async function uploadSkillZip(file, { overwrite = false } = {}) {
  const url = '/skills/upload' + (overwrite ? '?overwrite=true' : '');
  try {
    const r = await api.upload(url, file);
    const names = (r.installed || []).map(i => i.name);
    toast(`已安装 ${names.length} 个技能：${names.join('、')}${names.some((_, i) => r.installed[i].overwritten) ? '（含覆盖）' : ''}`);
    (r.warnings || []).forEach(w => toast(w, 'warn'));
    await loadSkillsPanel();
    await loadTools();
  } catch (e) {
    if (e.code === 'skill_conflict') {
      const list = (e.details?.conflicts || []).join('、');
      if (await confirmDialog(`以下技能已存在：${list}`, '覆盖会先把原 SKILL.md 备份为 .bak，再替换文件。')) {
        return uploadSkillZip(file, { overwrite: true });
      }
      return;
    }
    const extra = e.details?.entry ? `（${e.details.reason}: ${e.details.entry}）` : '';
    toast(`上传失败：${e.message}${extra}`, 'error');
  }
}
async function openSkillEditor(name) {
  const box = $('#skillEditor');
  let draft = { name: '', description: '', body: '', allowed_tools: [], version: null };
  if (name) {
    try { draft = await api.get(`/skills/${name}`); }
    catch (e) { return toast(e.message, 'error'); }
  } else {
    draft.body = '## 何时使用\n\n描述触发场景。\n\n## 步骤\n\n1. …';
  }
  const tools = Object.keys(S.toolIndex).sort();
  box.innerHTML = `
    <h3>${name ? '编辑技能' : '新建技能'}</h3>
    <div class="field"><label>name</label>
      <input id="skName" type="text" value="${esc(draft.name)}" ${name ? 'readonly' : ''}
        style="padding:6px 8px;border:1px solid var(--line-strong);border-radius:6px;background:${name ? 'var(--bg)' : 'var(--bg-elev)'}">
      <div class="hint">小写字母/数字/连字符，且必须与目录名一致（不可改）</div></div>
    <div class="field"><label>description</label>
      <input id="skDesc" type="text" value="${esc(draft.description || '')}"
        style="padding:6px 8px;border:1px solid var(--line-strong);border-radius:6px;background:var(--bg-elev)"></div>
    <div class="grid2">
      <div class="field"><label>allowed-tools</label>
        <textarea id="skTools" style="min-height:52px" placeholder="一行一个">${esc((draft.allowed_tools || []).join('\n'))}</textarea>
        <div class="hint">已注册：${tools.slice(0, 6).map(esc).join('、')}…</div></div>
      <div class="field"><label>version</label>
        <input id="skVer" type="text" value="${esc(draft.version || '')}"
          style="padding:6px 8px;border:1px solid var(--line-strong);border-radius:6px;background:var(--bg-elev)"></div>
    </div>
    <div class="field"><label>正文（Markdown）</label>
      <textarea id="skBody" style="min-height:200px">${esc(draft.body || '')}</textarea></div>
    <div class="editor-toolbar">
      <button class="btn primary" id="skSave">保存</button>
      <button class="btn" id="skCheck">校验</button>
      ${name ? '<button class="btn danger" id="skDelete">删除</button>' : ''}
      <span class="small muted">校验只检查，不落盘</span>
    </div>
    <div id="skIssues" style="margin-top:8px"></div>`;
  const readDraft = () => ({
    name: $('#skName').value.trim(),
    description: $('#skDesc').value.trim(),
    body: $('#skBody').value,
    allowed_tools: $('#skTools').value.split('\n').map(s => s.trim()).filter(Boolean),
    version: $('#skVer').value.trim() || null,
  });
  $('#skCheck').onclick = async () => {
    try {
      const r = await api.post('/skills/validate', readDraft());
      $('#skIssues').innerHTML = _skillIssueList(r.issues);
    } catch (e) { toast(e.message, 'error'); }
  };
  $('#skSave').onclick = async () => {
    const d = readDraft();
    if (!d.name) return toast('请填写 name', 'warn');
    if (!d.description) return toast('请填写 description', 'warn');
    try {
      const body = { description: d.description, body: d.body, allowed_tools: d.allowed_tools, version: d.version };
      const r = name
        ? await api.put(`/skills/${name}`, body)
        : await api.post('/skills', { name: d.name, ...body });
      $('#skIssues').innerHTML = _skillIssueList(r.issues);
      toast(`已保存 ${d.name}`);
      await loadSkillsPanel();
      await openSkillEditor(d.name);
      await loadTools();
    } catch (e) { toast(`${e.message}`, 'error'); }
  };
  const del = $('#skDelete');
  if (del) del.onclick = async () => {
    if (!(await confirmDialog(`删除技能「${name}」？`, '整个技能目录（含资源文件）都会被删除。'))) return;
    try { await api.del(`/skills/${name}`); toast('已删除'); await loadSkillsPanel(); await loadTools(); }
    catch (e) { toast(e.message, 'error'); }
  };
}
async function toggleTool(name, enable) {
  try {
    const cur = await api.get('/config');
    const cfg = cur.config || {};
    cfg.tools = cfg.tools || {};
    const disabled = new Set(cfg.tools.disabled || []);
    enable ? disabled.delete(name) : disabled.add(name);
    cfg.tools.disabled = Array.from(disabled);
    const res = await api.put('/config', { config: cfg, reload: true });
    applyConfigResponse(res);
    toast(`已${enable ? '启用' : '停用'} ${name}`);
  } catch (e) { toast(e.message, 'error'); }
}
/* =====================================================================
   10. 面板：记忆
   ===================================================================== */
async function loadMemory() {
  const el = $('#paneMemory');
  el.innerHTML = '<div class="card muted">加载中…</div>';
  try {
    const m = await api.get('/memory');
    if (!m.enabled) { el.innerHTML = '<div class="card muted">长期记忆未启用（memory.enabled=false）。</div>'; return; }
    el.innerHTML = `<div class="card">
      <h3>MEMORY.md</h3>
      <div class="small muted">${esc(m.path)} · ${m.chars}/${m.max_chars} 字符（剩余 ${m.remaining_chars}）</div>
      <div class="bar"><i style="width:${Math.min(100, m.chars / m.max_chars * 100)}%"></i></div>
      <textarea id="memText" style="width:100%;min-height:260px;font-family:var(--mono);font-size:12px;
        padding:8px;border:1px solid var(--line-strong);border-radius:6px;background:var(--bg-elev)"></textarea>
      <div class="row" style="margin-top:8px">
        <button class="btn primary" id="saveMem">保存</button>
        <button class="btn" id="reloadMem">重新加载</button>
        <span class="small muted">${m.entries.length} 条记忆</span>
      </div>
    </div>`;
    $('#memText').value = m.content;
    $('#reloadMem').onclick = loadMemory;
    $('#saveMem').onclick = async () => {
      try {
        const r = await api.put('/memory', { content: $('#memText').value });
        toast(`已保存（${r.entries.length} 条记忆）`);
        loadMemory();
      } catch (e) {
        if (e.code === 'memory_full') toast(`记忆已满（上限 ${e.details?.max_chars} 字符）`, 'error');
        else toast(e.message, 'error');
      }
    };
  } catch (e) { el.innerHTML = `<div class="card" style="color:var(--danger)">${esc(e.message)}</div>`; }
}

/* =====================================================================
   11. 面板：调用链 / 状态
   ===================================================================== */
function spanNode(node) {
  const span = node.span || {};
  const box = document.createElement('details');
  box.className = 'spnode';
  const okMark = span.ok === false ? ' <span style="color:var(--danger)">✗</span>' : '';
  const dur = span.duration_ms != null ? ` · ${Math.round(span.duration_ms)}ms` : '';
  box.innerHTML = `<summary class="small"><code>${esc(span.tool || span.span_id || 'span')}</code>${dur}${okMark}</summary>
    <pre class="code">${esc(JSON.stringify(span, null, 2))}</pre>`;
  for (const child of node.children || []) box.appendChild(spanNode(child));
  return box;
}
async function loadTrace() {
  const el = $('#paneObserve');
  const runId = S.lastRunId;
  if (!runId) { el.innerHTML = '<div class="card muted">还没有运行记录。发一轮对话后这里会显示调用链。</div>'; return; }
  el.innerHTML = '<div class="card muted">加载中…</div>';
  let data;
  try { data = await api.get(`/runs/${runId}/trace?source=memory`); }
  catch (e) { el.innerHTML = `<div class="card" style="color:var(--danger)">${esc(e.message)}</div>`; return; }
  const s = data.summary || {};
  const wrap = document.createElement('div');
  wrap.className = 'card';
  wrap.innerHTML = `<h3>本次调用链</h3>
    <div class="kv">
      <dt>span 数</dt><dd>${s.span_count ?? 0}</dd>
      <dt>错误数</dt><dd>${s.error_count ?? 0}</dd>
      <dt>耗时</dt><dd>${s.duration_ms != null ? Math.round(s.duration_ms) + ' ms' : '—'}</dd>
      <dt>停止原因</dt><dd>${esc(s.stop_reason || '—')}</dd>
    </div>
    <div class="row" style="margin-top:8px"><button class="btn" id="reloadTrace">刷新</button>
      <span class="small muted">run ${esc(runId.slice(0, 8))}</span></div>`;
  const tree = document.createElement('div');
  if (!(data.tree || []).length) tree.innerHTML = '<div class="muted small">没有 span（未配置 tracer）</div>';
  for (const node of data.tree || []) tree.appendChild(spanNode(node));
  wrap.appendChild(tree);
  el.innerHTML = ''; el.appendChild(wrap);
  $('#reloadTrace').onclick = loadTrace;
}
async function loadHealth() {
  const el = $('#paneHealth');
  try {
    const h = await api.get('/healthz');
    el.innerHTML = `<div class="card">
      <h3>服务状态</h3>
      <div class="kv">
        <dt>状态</dt><dd style="color:var(--ok)">${esc(h.status)}</dd>
        <dt>版本</dt><dd>${esc(h.version)}</dd>
        <dt>已运行</dt><dd>${Math.round(h.uptime_s)}s</dd>
        <dt>工具数</dt><dd>${h.tools}</dd>
        <dt>技能数</dt><dd>${h.skills}</dd>
        <dt>配置文件</dt><dd>${esc(h.config_path || '—')}</dd>
        <dt>数据目录</dt><dd>${esc(h.data_dir || '—')}</dd>
        <dt>MCP</dt><dd>${h.mcp.connected}/${h.mcp.total}</dd>
        <dt>运行中 run</dt><dd>${h.active_runs}</dd>
      </div>
      <div class="row" style="margin-top:10px"><button class="btn" id="reloadHealth">刷新</button></div>
    </div>`;
    $('#reloadHealth').onclick = loadHealth;
    $('#healthLine').textContent = `工具 ${h.tools} · 运行中 ${h.active_runs}`;
  } catch (e) { el.innerHTML = `<div class="card" style="color:var(--danger)">${esc(e.message)}</div>`; }
}

/* =====================================================================
   12. 面板调度 / 事件绑定 / 初始化
   ===================================================================== */
function currentPane() { return document.querySelector(`.pane[data-pane="${S.tab}"]`); }
function renderAllPanels() {
  renderSessionPolicy();
  renderUsagePanel();
  if (S.tab === 'config') renderConfigPanel();
  if (S.tab === 'mcp') loadMcpPanel();
  if (S.tab === 'skills') loadSkillsPanel();
  if (S.tab === 'tools') loadTools();
  if (S.tab === 'memory') loadMemory();
  if (S.tab === 'observe') loadTrace();
  if (S.tab === 'health') loadHealth();
}
function showTab(tab) {
  if (!TABS.includes(tab)) tab = 'usage';
  S.tab = tab;
  localStorage.setItem(LS.tab, tab);
  $$('#tabs button[data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  $$('.pane').forEach(p => p.classList.toggle('on', p.dataset.pane === tab));
  renderAllPanels();
}
function setDrawer(open) {
  S.drawer = open;
  localStorage.setItem(LS.drawer, open ? '1' : '0');
  $('#app').classList.toggle('drawer-open', open);
  if (open) renderAllPanels();
}
function closeSidebarOnMobile() { if (innerWidth <= 760) document.body.classList.remove('side-open'); }

function bindEvents() {
  $('#send').onclick = send;
  $('#stop').onclick = cancelRun;
  $('#newSession').onclick = newSession;
  $('#sessionSearch').oninput = debounce(renderSessionList, 120);
  $('#drawerToggle').onclick = () => setDrawer(!S.drawer);
  $('#drawerClose').onclick = () => setDrawer(false);
  $('#menuToggle').onclick = () => document.body.classList.toggle('side-open');
  $('#themeToggle').onclick = () => {
    S.theme = S.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = S.theme;
    localStorage.setItem(LS.theme, S.theme);
  };
  $$('#tabs button[data-tab]').forEach(b => { b.onclick = () => showTab(b.dataset.tab); });
  $('#attachBtn').onclick = () => $('#fileInput').click();
  $('#fileInput').onchange = (e) => { onPickFiles(e.target.files); e.target.value = ''; };

  const input = $('#input');
  let composing = false;
  input.addEventListener('compositionstart', () => { composing = true; });
  input.addEventListener('compositionend', () => { composing = false; });
  input.addEventListener('input', () => autoGrow(input));
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      if (composing || e.isComposing || e.keyCode === 229) return;
      e.preventDefault(); send();
    }
  });
  input.addEventListener('paste', (e) => {
    const files = Array.from(e.clipboardData?.files || []);
    if (files.length) { e.preventDefault(); onPickFiles(files); }
  });
  $('#chatTitle').ondblclick = () => {
    const li = $(`.session-item[data-id="${CSS.escape(S.sessionId || '')}"]`);
    const s = S.sessions.find(x => x.session_id === S.sessionId);
    if (li && s) startRename(li, s);
  };
  document.addEventListener('keydown', (e) => {
    if (e.altKey && (e.key === 'n' || e.key === 'N')) { e.preventDefault(); newSession(); }
    if (e.key === 'Escape') { setDrawer(false); }
  });
  addEventListener('online', () => $('#offlineBanner').classList.remove('on'));
  addEventListener('offline', () => $('#offlineBanner').classList.add('on'));
}

async function init() {
  document.documentElement.dataset.theme = S.theme;
  bindEvents();
  if (!navigator.onLine) $('#offlineBanner').classList.add('on');
  // 先拉配置：MCP / 技能面板都依赖 S.config，早于首次渲染可避免「配置不可用」占位符残留。
  await loadConfig({ refreshTools: false });
  await loadTools();
  setDrawer(S.drawer);
  showTab(S.tab);
  await loadSessions();
  loadHealth();
  // 恢复上次会话
  const sid = localStorage.getItem(LS.sid);
  if (sid && S.sessions.some(s => s.session_id === sid)) await openSession(sid);
  else showEmpty();
}

init();
</script>
